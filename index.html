<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>热烈欢迎佳瑶女士生辰日 🎂</title>
<meta name="description" content="热烈欢迎佳瑶女士生辰日 · 生日快乐 🎂">
<meta property="og:title" content="热烈欢迎佳瑶女士生辰日 🎂">
<meta property="og:description" content="愿你所行皆坦途，所遇皆温柔">
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
html,body{height:100%;overflow:hidden;background:#1a0505;}
body{
font-family:"Songti SC","STSong","SimSun","Noto Serif SC",serif;
color:#fff;
user-select:none;
/* 喜庆的宴席背景：深红到酒红的径向渐变 */
background: radial-gradient(circle at 50% 100%, #7a0f1a 0%, #4a0710 40%, #1a0305 100%);
display: flex;
justify-content: center;
align-items: center;
}
/* ===== 宴席装饰（红灯笼、飘浮文字、彩带） ===== */
.bg-decor {
position: fixed; inset: 0;
pointer-events: none; z-index: 1;
overflow: hidden;
}
.lantern {
position: absolute; top: -60px;
width: 45px; height: 60px;
background: linear-gradient(180deg, #ff4d4d, #b30000);
border-radius: 50% 50% 20% 20%;
box-shadow: 0 0 25px rgba(255, 60, 0, 0.8);
animation: swing 3s ease-in-out infinite;
transform-origin: top center;
}
.lantern::before {
content: ''; position: absolute;
top: -8px; left: 50%; transform: translateX(-50%);
width: 6px; height: 8px; background: #ffd700; border-radius: 2px;
}
.lantern::after {
content: '福'; position: absolute;
left: 50%; top: 50%; transform: translate(-50%, -50%);
color: #ffd700; font-size: 18px; font-weight: bold; font-family: "KaiTi", "SimKai", serif;
}
.lantern.left { left: 5%; animation-delay: 0s; }
.lantern.right { right: 5%; animation-delay: 1.5s; }
@keyframes swing {
0%, 100% { transform: rotate(-8deg); }
50% { transform: rotate(8deg); }
}
/* 搞笑的飘动弹幕 */
.marquee-container {
position: absolute; top: 15%; left: 0; width: 100%; height: 40px; overflow: hidden;
opacity: 0.8;
}
.marquee-text {
position: absolute; white-space: nowrap;
font-size: 14px; font-weight: bold;
color: #ffd700; text-shadow: 0 0 8px #ff0000;
animation: marquee 12s linear infinite;
}
@keyframes marquee {
0% { transform: translateX(100vw); }
100% { transform: translateX(-100%); }
}
/* ===== 烟花画布 ===== */
#fw{
position:fixed;inset:0;width:100%;height:100%;
display:block;z-index:2;
}
/* ===== 舞台内容 ===== */
.stage{
position:fixed;inset:0;z-index:3;
display:flex;flex-direction:column;
align-items:center;justify-content:center;
gap:clamp(6px,1.6vh,18px);
padding:max(3vh,env(safe-area-inset-top)) 5vw max(3vh,env(safe-area-inset-bottom));
text-align:center;
pointer-events:none;
}
.fade-up{opacity:0;animation:fadeUp .95s cubic-bezier(.22,.9,.3,1) forwards;}
@keyframes fadeUp{
from{opacity:0;transform:translateY(26px) scale(.96);}
to{opacity:1;transform:translateY(0) scale(1);}
}
.title{
font-size:clamp(21px,5.6vw,46px);
letter-spacing:.08em;
font-weight:700;
background:linear-gradient(180deg,#fffbe0 0%,#ffe08a 35%,#ffb63c 62%,#fff3b0 100%);
-webkit-background-clip:text;background-clip:text;
color:transparent;
filter:drop-shadow(0 0 18px rgba(255,180,60,.8)) drop-shadow(0 2px 6px rgba(0,0,0,.8));
animation:fadeUp .95s cubic-bezier(.22,.9,.3,1) forwards, glowPulse 2.6s ease-in-out infinite 1.2s;
}
@keyframes glowPulse{
0%,100%{filter:drop-shadow(0 0 14px rgba(255,180,60,.6)) drop-shadow(0 2px 6px rgba(0,0,0,.8));}
50%{filter:drop-shadow(0 0 35px rgba(255,215,0,1)) drop-shadow(0 2px 6px rgba(0,0,0,.8));}
}
.subtitle{
font-size:clamp(11px,3.1vw,16px);
letter-spacing:.28em;
color:#ffdca0;
opacity:.9;
text-shadow:0 0 12px rgba(255,60,0,.8);
}
/* ===== 蛋糕 ===== */
.cake{
position:relative;
width:clamp(140px,42vw,220px);
aspect-ratio:5/4;
margin:clamp(4px,1.4vh,14px) 0;
filter:drop-shadow(0 16px 24px rgba(0,0,0,.8)) drop-shadow(0 0 35px rgba(255,100,0,.4));
}
.tier{position:absolute;border-radius:7px;}
.tier::before{
content:'';position:absolute;left:-1px;right:-1px;top:-7px;height:14px;
background-image:radial-gradient(circle at 7px 7px,var(--cream) 6.4px,transparent 6.9px);
background-size:14px 14px;background-repeat:repeat-x;
}
.t3{
left:0;right:0;bottom:5%;height:32%;
background:linear-gradient(180deg,#ffd3e3,#ff8fbb 70%,#f4749f);
--cream:#fff2f7;
}
.t2{
left:11%;right:11%;bottom:35%;height:26%;
background:linear-gradient(180deg,#ffeec2,#ffc463 70%,#f5a83c);
--cream:#fffaf0;
}
.t1{
left:23%;right:23%;bottom:58%;height:25%;
background:linear-gradient(180deg,#fff6fa,#ffc7dd 70%,#ffa8c8);
--cream:#ffffff;
}
.plate{
position:absolute;left:-7%;right:-7%;bottom:0;height:8%;
border-radius:50%;
background:linear-gradient(180deg,#f2f4ff,#9aa2bd 60%,#6e7590);
box-shadow:0 4px 14px rgba(0,0,0,.8);
}
.candle{
position:absolute;bottom:80%;left:50%;
width:9px;height:18%;
margin-left:-4.5px;
border-radius:3px;
background:repeating-linear-gradient(45deg,#ff8fb8 0 5px,#fffdfd 5px 10px);
box-shadow:0 0 12px rgba(255,200,120,.8);
}
.flame{
position:absolute;left:50%;bottom:100%;
width:15px;height:23px;margin-left:-7.5px;margin-bottom:2px;
background:radial-gradient(ellipse at 50% 76%,
#ffffff 0%,#fff4a8 26%,#ffc02e 56%,rgba(255,120,0,.85) 76%,rgba(255,80,0,0) 100%);
border-radius:50% 50% 46% 46% / 72% 72% 30% 30%;
transform-origin:50% 100%;
animation:flick .28s infinite alternate ease-in-out;
filter:blur(.4px);
}
@keyframes flick{
from{transform:scale(1) rotate(-3deg);opacity:.9;}
to{transform:scale(1.14,1.22) rotate(3deg);opacity:1;}
}
.halo{
position:absolute;left:50%;bottom:88%;
width:70px;height:70px;margin-left:-35px;
border-radius:50%;
background:radial-gradient(circle,rgba(255,190,90,.6) 0%,rgba(255,150,40,0) 70%);
animation:halo 2.4s ease-in-out infinite;
pointer-events:none;
}
@keyframes halo{
0%,100%{transform:scale(1);opacity:.75;}
50%{transform:scale(1.25);opacity:1;}
}
/* ===== 祝福语 ===== */
.bless{
display:flex;flex-direction:column;gap:.45em;
font-size:clamp(12px,3.4vw,18px);
line-height:1.75;
letter-spacing:.14em;
color:#ffeccb;
text-shadow:0 0 14px rgba(255,60,0,.8),0 1px 4px rgba(0,0,0,.9);
}
.sign{
font-size:clamp(15px,4.1vw,25px);
letter-spacing:.16em;
font-weight:700;
background:linear-gradient(180deg,#fff8d8,#ffcf5c 55%,#ff9f2e);
-webkit-background-clip:text;background-clip:text;color:transparent;
filter:drop-shadow(0 0 20px rgba(255,170,50,.9));
}
/* ===== 开场提示 ===== */
.tap-overlay{
position:fixed;inset:0;z-index:50;
display:flex;align-items:flex-end;justify-content:center;
padding-bottom:8vh;
background:radial-gradient(ellipse at center,rgba(0,0,0,0) 35%,rgba(0,0,0,.6) 100%);
transition:opacity .55s ease;
cursor:pointer;
}
.tap-overlay.hide{opacity:0;pointer-events:none;}
.tap-card{
display:flex;align-items:center;gap:.55em;
padding:.72em 1.5em;
border:1px solid rgba(255,220,150,.8);
border-radius:999px;
background:rgba(60,0,0,.7);
color:#ffe7b0;
font-size:clamp(12px,3.5vw,16px);
letter-spacing:.14em;
backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);
box-shadow:0 0 35px rgba(255,60,0,.6);
animation:breathe 1.9s ease-in-out infinite;
}
.tap-note{font-size:1.15em;animation:sway 1.4s ease-in-out infinite alternate;}
@keyframes breathe{
0%,100%{transform:translateY(0);opacity:.85;}
50%{transform:translateY(-5px);opacity:1;}
}
@keyframes sway{from{transform:rotate(-12deg);}to{transform:rotate(12deg);}}
@media (max-height:620px){
.cake{width:clamp(110px,30vw,150px);}
.bless{font-size:clamp(11px,3vw,14px);}
.stage{gap:4px;}
}
</style>
</head>
<body>
<!-- 宴席装饰层 -->
<div class="bg-decor">
<div class="lantern left"></div>
<div class="lantern right"></div>
<div class="marquee-container">
<div class="marquee-text" style="top:0;">🎋 佳瑶女士吃好喝好，肉肉都归你 🎋</div>
</div>
</div>
<canvas id="fw"></canvas>
<div class="stage">
<h1 class="title">热烈欢迎佳瑶女士生辰日</h1>
<div class="subtitle fade-up" style="animation-delay:.45s">🎊 恭贺芳辰 · 喜乐安康 🎊</div>
<div class="cake fade-up" style="animation-delay:.7s">
<div class="halo"></div>
<div class="candle"><div class="flame"></div></div>
<div class="tier t1"></div>
<div class="tier t2"></div>
<div class="tier t3"></div>
<div class="plate"></div>
</div>
<div class="bless fade-up" style="animation-delay:1.05s">
<p>愿你所行皆坦途，所遇皆温柔</p>
<p>愿你所盼皆如愿，所念皆星河</p>
<p>笑靥如花，岁岁欢喜，年年胜意</p>
</div>
<p class="sign fade-up" style="animation-delay:1.5s">佳瑶女士，生日快乐 🎂</p>
</div>
<div class="tap-overlay" id="tapOverlay">
<div class="tap-card"><span class="tap-note">♪</span><span>轻触屏幕 · 开启生日歌</span></div>
</div>
<script>
(function () {
'use strict';
/* ============================================================
一、眼花缭乱的烟花粒子系统（重写版）
============================================================ */
var canvas = document.getElementById('fw');
var ctx = canvas.getContext('2d');
var W = 0, H = 0, DPR = Math.min(window.devicePixelRatio || 1, 2);
var rockets = [], particles = [], confettiList = [];
function resize() {
W = canvas.clientWidth || window.innerWidth;
H = canvas.clientHeight || window.innerHeight;
canvas.width = Math.floor(W * DPR);
canvas.height = Math.floor(H * DPR);
ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
}
window.addEventListener('resize', resize);
window.addEventListener('orientationchange', function () { setTimeout(resize, 200); });
resize();
function rand(a, b) { return a + Math.random() * (b - a); }
/* 发射礼花弹 */
function launchRocket() {
var x = rand(W * 0.1, W * 0.9);
var targetY = rand(H * 0.05, H * 0.45);
var startY = H + 10;
var g = 0.22;
var vy = -Math.sqrt(2 * g * (startY - targetY));
rockets.push({
x: x, y: startY,
vx: rand(-0.8, 0.8), vy: vy, g: g, targetY: targetY,
hue: Math.floor(rand(0, 360))
});
}
/* 多样化爆炸 */
function explode(x, y, hue) {
if (particles.length > 3000) return;
var scale = Math.min(W, H) / 430;
scale = Math.max(0.7, Math.min(scale, 1.8));
// 随机形状：0标准球，1环形，2心形，3垂柳，4爆裂
var shape = Math.floor(rand(0, 5));
var count = 60 + Math.floor(Math.random() * 60);
for (var i = 0; i < count; i++) {
var a, sp;
if (shape === 1) { // 环形
a = (i / count) * Math.PI * 2;
sp = 5.5 * scale;
} else if (shape === 2) { // 心形
var t = (i / count) * Math.PI * 2;
var hx = 16 * Math.pow(Math.sin(t), 3);
var hy = -(13 * Math.cos(t) - 5 * Math.cos(2*t) - 2 * Math.cos(3*t) - Math.cos(4*t));
a = Math.atan2(hy, hx);
sp = Math.sqrt(hx*hx + hy*hy) * 0.35 * scale;
} else { // 标准球 & 垂柳 & 爆裂
a = Math.random() * Math.PI * 2;
sp = Math.pow(Math.random(), 0.6) * 6.5 * scale;
}
var decay = 0.005 + Math.random() * 0.01;
var grav = 0.045 + Math.random() * 0.03;
if (shape === 3) { // 垂柳：重力大，寿命长
decay = 0.002 + Math.random() * 0.003;
grav = 0.09 + Math.random() * 0.04;
} else if (shape === 4) { // 爆裂：寿命短
decay = 0.02 + Math.random() * 0.02;
}
// 颜色：金、红、粉、紫、青
var palette = [45, 0, 330, 280, 180, 50];
var baseHue = palette[Math.floor(Math.random() * palette.length)];
var color = 'hsl(' + (baseHue + rand(-15, 15)).toFixed(0) + ',100%,' +
(60 + Math.random() * 25).toFixed(0) + '%)';
particles.push({
x: x, y: y,
vx: Math.cos(a) * sp + rand(-0.3, 0.3),
vy: Math.sin(a) * sp + rand(-0.3, 0.3),
life: 1, decay: decay, g: grav,
size: 1.2 + Math.random() * 2.2,
color: color
});
}
// 中心闪光
for (var j = 0; j < 15; j++) {
var ang = Math.random() * Math.PI * 2;
particles.push({
x: x, y: y,
vx: Math.cos(ang) * 2 * scale,
vy: Math.sin(ang) * 2 * scale,
life: 1, decay: 0.04, g: 0.02,
size: 2 + Math.random() * 2,
color: '#ffffff'
});
}
}
/* 底部礼炮/彩带 */
function launchConfetti() {
if (confettiList.length > 200) return;
var x = rand(0, W);
var y = H + 10;
confettiList.push({
x: x, y: y,
vx: rand(-1.5, 1.5), vy: rand(-12, -7),
g: 0.18, size: rand(4, 8),
color: 'hsl(' + Math.floor(rand(0, 360)) + ',100%,65%)',
rot: rand(0, Math.PI * 2),
vr: rand(-0.2, 0.2),
life: 1, decay: 0.005
});
}
var lastTime = performance.now();
var spawnAcc = 0;
function tick(now) {
requestAnimationFrame(tick);
var dt = (now - lastTime) / 16.667;
if (dt > 3) dt = 3;
if (dt <= 0) dt = 1;
lastTime = now;
// 透明画布上的尾迹效果
ctx.globalCompositeOperation = 'destination-out';
ctx.fillStyle = 'rgba(0, 0, 0, 0.18)';
ctx.fillRect(0, 0, W, H);
ctx.globalCompositeOperation = 'lighter';
// 高频发射，让烟花眼花缭乱
spawnAcc += dt;
if (spawnAcc >= 10) { // 发射频率提高3倍
spawnAcc = 0;
launchRocket();
if (Math.random() < 0.6) launchRocket(); // 双发
if (Math.random() < 0.3) launchConfetti(); // 底部撒花
}
// 更新礼花弹
for (var i = rockets.length - 1; i >= 0; i--) {
var r = rockets[i];
r.vy += r.g * dt;
r.x += r.vx * dt;
r.y += r.vy * dt;
ctx.beginPath();
ctx.fillStyle = 'hsla(' + r.hue + ',100%,80%,0.95)';
ctx.arc(r.x, r.y, 2.5, 0, 7);
ctx.fill();
if (r.vy >= 0 || r.y <= r.targetY) {
explode(r.x, r.y, r.hue);
rockets.splice(i, 1);
}
}
// 更新烟花粒子
for (var k = particles.length - 1; k >= 0; k--) {
var p = particles[k];
p.vx *= (1 - 0.022 * dt);
p.vy *= (1 - 0.022 * dt);
p.vy += p.g * dt;
p.x += p.vx * dt;
p.y += p.vy * dt;
p.life -= p.decay * dt;
if (p.life <= 0 || p.y > H + 80 || p.x < -80 || p.x > W + 80) {
particles.splice(k, 1); continue;
}
ctx.globalAlpha = Math.max(0, p.life);
ctx.fillStyle = p.color;
ctx.beginPath();
ctx.arc(p.x, p.y, p.size, 0, 7);
ctx.fill();
}
// 更新彩带
for (var c = confettiList.length - 1; c >= 0; c--) {
var cf = confettiList[c];
cf.vy += cf.g * dt;
cf.x += cf.vx * dt;
cf.y += cf.vy * dt;
cf.rot += cf.vr * dt;
cf.life -= cf.decay * dt;
if (cf.life <= 0 || cf.y > H + 50) {
confettiList.splice(c, 1); continue;
}
ctx.globalAlpha = cf.life;
ctx.fillStyle = cf.color;
ctx.save();
ctx.translate(cf.x, cf.y);
ctx.rotate(cf.rot);
ctx.fillRect(-cf.size / 2, -cf.size / 2, cf.size, cf.size);
ctx.restore();
}
ctx.globalAlpha = 1;
}
requestAnimationFrame(tick);
// 开场炸裂
setTimeout(launchRocket, 200);
setTimeout(launchRocket, 500);
setTimeout(launchConfetti, 300);
/* ============================================================
二、《生日快乐》歌 —— Web Audio 实时合成
============================================================ */
var NOTES = { G4:392.00, A4:440.00, B4:493.88, C5:523.25, D5:587.33, E5:659.25, F5:698.46, G5:783.99 };
var MELODY = [
['G4', 0.75], ['G4', 0.25], ['A4', 1], ['G4', 1], ['C5', 1], ['B4', 2],
['G4', 0.75], ['G4', 0.25], ['A4', 1], ['G4', 1], ['D5', 1], ['C5', 2],
['G4', 0.75], ['G4', 0.25], ['G5', 1], ['E5', 1], ['C5', 1], ['B4', 1], ['A4', 2],
['F5', 0.75], ['F5', 0.25], ['E5', 1], ['C5', 1], ['D5', 1], ['C5', 2],
[null, 1.5]
];
var BEAT = 0.545;
var audioCtx = null, masterGain = null, started = false, loopTimer = null;
function playNote(freq, when, dur, vol) {
var o1 = audioCtx.createOscillator(); o1.type = 'triangle'; o1.frequency.setValueAtTime(freq, when);
var g1 = audioCtx.createGain();
g1.gain.setValueAtTime(0.0001, when);
g1.gain.linearRampToValueAtTime(vol, when + 0.018);
g1.gain.exponentialRampToValueAtTime(0.0001, when + dur);
o1.connect(g1); g1.connect(masterGain); o1.start(when); o1.stop(when + dur + 0.06);
var o2 = audioCtx.createOscillator(); o2.type = 'sine'; o2.frequency.setValueAtTime(freq * 2, when);
var g2 = audioCtx.createGain();
g2.gain.setValueAtTime(0.0001, when);
g2.gain.linearRampToValueAtTime(vol * 0.26, when + 0.018);
g2.gain.exponentialRampToValueAtTime(0.0001, when + dur * 0.7);
o2.connect(g2); g2.connect(masterGain); o2.start(when); o2.stop(when + dur + 0.06);
}
function scheduleSong() {
var t = audioCtx.currentTime + 0.15;
for (var i = 0; i < MELODY.length; i++) {
var name = MELODY[i][0], beats = MELODY[i][1], dur = beats * BEAT;
if (name) playNote(NOTES[name], t, dur * 0.92, 0.30);
t += dur;
}
return t;
}
function loopSong() {
if (!started) return;
var end = scheduleSong();
var wait = Math.max(1000, (end - audioCtx.currentTime + 2.2) * 1000);
loopTimer = setTimeout(loopSong, wait);
}
var overlay = document.getElementById('tapOverlay');
function hideOverlay() {
if (!overlay || overlay.classList.contains('hide')) return;
overlay.classList.add('hide');
setTimeout(function () { overlay.style.display = 'none'; }, 650);
}
function boot() {
if (started) return;
var AC = window.AudioContext || window.webkitAudioContext;
if (!AC) { hideOverlay(); return; }
try {
if (!audioCtx) {
audioCtx = new AC();
masterGain = audioCtx.createGain();
masterGain.gain.value = 0.5;
masterGain.connect(audioCtx.destination);
}
var p = audioCtx.resume();
Promise.resolve(p).then(function () {
if (audioCtx.state === 'running' && !started) {
started = true; hideOverlay(); loopSong();
}
}).catch(function () {});
} catch (e) {}
}
window.addEventListener('load', boot);
document.addEventListener('DOMContentLoaded', function () { setTimeout(boot, 120); });
document.addEventListener('click', boot);
document.addEventListener('touchstart', boot, { passive: true });
document.addEventListener('keydown', boot);
document.addEventListener('visibilitychange', function () {
if (!document.hidden && audioCtx && audioCtx.state === 'suspended' && started) {
audioCtx.resume();
}
});
})();
</script>
</body>
</html>
